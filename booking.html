<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Car Rental Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }
    .container {
      width: 50%;
      margin: 50px auto;
      padding: 20px;
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    h2 {
      text-align: center;
    }
    label {
      display: block;
      margin: 10px 0 5px;
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }
    button {
      padding: 10px 15px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 5px;
      width: 100%;
      cursor: pointer;
    }
    button:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Car Rental Form</h2>
  <form id="carRentalForm">
    <label for="name">Full Name</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <!-- <label for="pickupLocation">Pickup Location</label>
    <input type="text" id="pickupLocation" name="pickupLocation" required> -->

    <label for="dop">Date of Pickup (DOP)</label>
    <input type="date" id="dop" name="dop" required>

    <label for="carType">Car Type</label>
    <select id="carType" name="carType" required>
      <option value="SUV">SUV</option>
      <option value="Sedan">Sedan</option>
      <option value="Hatchback">Hatchback</option>
      <option value="Convertible">Convertible</option>
    </select>

    <button type="submit">Submit</button>
  </form>
</div>

<script>
  document.getElementById('carRentalForm').addEventListener('submit', function(event) {
    event.preventDefault();
    
    // Get form values
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    // const pickupLocation = document.getElementById('pickupLocation').value;
    const dop = document.getElementById('dop').value;
    const carType = document.getElementById('carType').value;

    // Save details to LocalStorage
    const bookingDetails = {
      name,
      email,
      // pickupLocation,
      dop,
      carType
    };

    localStorage.setItem("bookingDetails", JSON.stringify(bookingDetails));

    // Redirect to payment page
    window.location.href = "payment.html";
  });
</script>

</body>
</html>
