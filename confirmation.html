<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Booking Confirmed</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #e9f7ef;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .confirmation {
      background-color: white;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    .confirmation h1 {
      color: #28a745;
      font-size: 28px;
      margin-bottom: 20px;
    }
    .confirmation p {
      font-size: 16px;
      color: #333;
    }
    .confirmation a {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      background-color: #28a745;
      color: white;
      padding: 10px 20px;
      border-radius: 6px;
    }
    .confirmation a:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>

<div class="confirmation">
  <h1>Booking Confirmed!</h1>
  <p>Thank you for your payment. Your car rental booking is now confirmed.</p>
  <a href="index.html">Book Another Ride</a>
</div>

</body>
</html>
